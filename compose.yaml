name: smart-maintenance
services:
  model:
    build:
      context: .
      dockerfile: Dockerfile.model
    volumes:
      - ./models/active:/app/model:ro
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ping', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SMART_MAINTENANCE_MODEL_URL: http://model:5001
      SMART_MAINTENANCE_PYTHON: /usr/local/bin/python
      SMART_MAINTENANCE_DVC: /usr/local/bin/dvc
    volumes:
      - .:/workspace
      - /home/sidhartha/dvc-storage/smart-maintenance:/home/sidhartha/dvc-storage/smart-maintenance:ro
    depends_on:
      model:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  ui:
    image: nginx:1.29-alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/host/root"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    read_only: true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=2d", "--storage.tsdb.retention.size=256MB"]
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
      blackbox:
        condition: service_started
      node-exporter:
        condition: service_started
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smart-maintenance.json
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/smart-maintenance.json:/var/lib/grafana/dashboards/smart-maintenance.json:ro
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

volumes:
  prometheus_data:
