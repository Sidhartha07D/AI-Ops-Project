stages:
  validate_source:
    cmd: python src/validate_data.py --report reports/source_validation.json
    deps:
      - data/raw/ai4i2020.csv
      - src/validate_data.py
    outs:
      - reports/source_validation.json
  prepare_spark:
    cmd: python src/prepare_spark.py
    deps:
      - data/raw/ai4i2020.csv
      - reports/source_validation.json
      - src/prepare_spark.py
    outs:
      - data/processed/spark_features.csv
  prepare_ray:
    cmd: python src/prepare_ray.py
    deps:
      - data/raw/ai4i2020.csv
      - reports/source_validation.json
      - src/prepare_ray.py
    outs:
      - data/processed/ray_features.csv
  compare:
    cmd: python src/compare_features.py > reports/feature_comparison.txt
    deps:
      - data/processed/spark_features.csv
      - data/processed/ray_features.csv
      - src/compare_features.py
    outs:
      - reports/feature_comparison.txt
  make_splits:
    cmd: python src/make_splits.py
    deps:
      - data/processed/spark_features.csv
      - reports/feature_comparison.txt
      - src/make_splits.py
    outs:
      - data/splits/split_ids.csv
      - reports/split_summary.json
  train_candidate:
    cmd: python scripts/train_candidate.py
    deps:
      - data/processed/spark_features.csv
      - data/splits/split_ids.csv
      - src/train_models.py
      - scripts/train_candidate.py
      - scripts/artifacts.py
      - environment.yml
      - environment.snapshot.yml
    params:
      - candidate
    outs:
      - models/pipeline_candidate
      - reports/pipeline_training.json
  evaluate_candidate:
    cmd: python scripts/evaluate_candidate.py
    deps:
      - models/pipeline_candidate
      - reports/pipeline_training.json
      - data/processed/spark_features.csv
      - data/splits/split_ids.csv
      - reports/model_evaluation.json
      - scripts/evaluate_candidate.py
      - scripts/artifacts.py
      - src/train_models.py
    metrics:
      - reports/pipeline_evaluation.json:
          cache: false
  package_candidate:
    cmd: python scripts/package_candidate.py
    deps:
      - models/pipeline_candidate
      - reports/pipeline_evaluation.json
      - scripts/package_candidate.py
      - scripts/artifacts.py
    outs:
      - reports/candidate_release.json
