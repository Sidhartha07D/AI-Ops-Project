name: checks
on:
  push:
  pull_request:
jobs:
  source-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install check dependencies
        run: python -m pip install fastapi==0.162.0 pyyaml==6.0.3 dvc==3.67.1 prometheus-client==0.23.1
      - name: Compile Python source
        run: python -m compileall -q api src scripts
      - name: Unit tests
        run: python scripts/phase6_tests.py
      - name: Validate DVC DAG
        run: dvc dag
      - name: Validate Compose syntax
        run: docker compose config --quiet
